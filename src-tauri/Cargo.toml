[package]
name = "morrow"
version = "0.1.0"
description = "Morrow desktop shell"
authors = ["Morrow"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "morrow"

[lib]
name = "morrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "morrow"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
morrow-detection = { path = "../crates/morrow-detection" }
morrow-calendar = { path = "../crates/morrow-calendar" }
morrow-messages = { path = "../crates/morrow-messages" }
morrow-storage = { path = "../crates/morrow-storage" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
time = { version = "0.3.51", features = ["parsing"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
embed_plist = "1.2.2"
security-framework = "2.11.1"
security-framework-sys = "2.17.0"
