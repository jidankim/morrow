[package]
name = "morrow"
version = "0.1.0"
description = "Morrow desktop shell"
authors = ["Morrow"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "morrow"

[lib]
name = "morrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "morrow"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
morrow-detection = { workspace = true }
morrow-diagnostics = { workspace = true }
morrow-calendar = { workspace = true }
morrow-messages = { workspace = true }
morrow-reminders = { workspace = true }
morrow-storage = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2", features = [] }
time = { version = "0.3.51", features = ["parsing"] }
time-tz = { version = "2.0.0", features = ["system"] }

[dev-dependencies]
regex = "1.12.4"
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
embed_plist = "1.2.2"
security-framework = "2.11.1"
security-framework-sys = "2.17.0"
