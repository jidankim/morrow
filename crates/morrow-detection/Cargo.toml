[package]
name = "morrow-detection"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
morrow-diagnostics = { workspace = true }
morrow-messages = { workspace = true }
morrow-storage = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3.51", features = ["parsing"] }
time-tz = { version = "2.0.0", features = ["system"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
