[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/morrow-calendar",
    "crates/morrow-detection",
    "crates/morrow-diagnostics",
    "crates/morrow-messages",
    "crates/morrow-reconcile",
    "crates/morrow-reminders",
    "crates/morrow-storage",
]

[workspace.dependencies]
morrow-calendar = { path = "crates/morrow-calendar" }
morrow-detection = { path = "crates/morrow-detection" }
morrow-diagnostics = { path = "crates/morrow-diagnostics" }
morrow-messages = { path = "crates/morrow-messages" }
morrow-reminders = { path = "crates/morrow-reminders" }
morrow-storage = { path = "crates/morrow-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
